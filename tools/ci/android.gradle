// CI artifacts must not use or replace the developer's existing signing key.
allprojects {
    plugins.withId('com.android.application') {
        android.buildTypes.configureEach { type ->
            if (type.name == 'debug') type.signingConfig = null
        }
    }
    tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
        outputs.upToDateWhen { false }
        outputs.doNotCacheIf('Fresh CI verification results') { true }
        maxParallelForks = 1
        testLogging {
            events 'failed'
            exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL
            showExceptions = true
            showCauses = true
            showStackTraces = true
        }
    }
}
